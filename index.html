<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />

    <title>과제 모음</title>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: sans-serif;
      }

      /* 왼쪽 메뉴 */
      #menu {
        position: fixed;
        top: 0;
        left: 0;
        width: 180px;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
        background: #fff;
      }

      #menu a {
        display: block;
        margin-bottom: 10px;
        cursor: pointer;
        color: blue;
      }

      /* 작품이 보이는 영역 */
      #stage {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 180px;
        overflow: hidden;
      }

      #viewer {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>

  <body>
    <div id="menu">
      <a onclick="loadHomework('Dynamic-Balance')"> Dynamic Balance </a>

      <a onclick="loadHomework('Delete-Delete-Delete')">
        Delete, Delete, Delete
      </a>
    </div>

    <div id="stage">
      <!-- 처음 사이트를 열었을 때 Dynamic Balance가 표시됨 -->
      <iframe id="viewer" src="Dynamic-Balance/index.html"> </iframe>
    </div>

    <script>
      function loadHomework(folderName) {
        document.getElementById("viewer").src = folderName + "/index.html";
      }
    </script>
  </body>
</html>
